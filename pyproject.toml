[project]
name = "holter-analysis-assist-license-server"
version = "0.1.0"
description = "License and inference usage service on Cloudflare Workers"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = ["--import-mode=importlib"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "workers-py>=1.17.4",
    "workers-runtime-sdk>=1.9.0",
]
